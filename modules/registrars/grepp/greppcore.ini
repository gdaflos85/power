; Configuration file for liagkos/greppcore

[urls]
reg = "https://regepp.ics.forth.gr:700/epp/proxy"
uat = "https://uat-regepp.ics.forth.gr:700/epp/proxy"

[certificates]
; relative to grepccore.ini folder
;reg = "certificates/regepp_ics_forth_gr_chain.pem"
;uat = "certificates/uat-regepp_ics_forth_gr_chain.pem"
reg = "certificates/ca-bundle.pem"

[language]
default = "el"

[templates]
; relative to grepccore.ini folder
;files = "xml/"
;compiled = "xml/compiled/"

[log]
; log levels = DEBUG|INFO|NOTICE|WARNING|ERROR
level = INFO
; relative to grepccore.ini folder
file = "logs/greppcore.log"
; file = off
browser = off
; browser_ip = "*"
browser_ip = "192.168.1.1,192.168.2.2"
clientip = on
show_credentials = on